# Single container: MinIO + PostgreSQL
#
# IMPORTANT (Docker Desktop + Windows SMB):
# Binding a mapped drive (M:) or UNC path directly yields a fake ~130MB disk
# and real ENOSPC. Instead, start.ps1 mounts the share via WSL drvfs at
# /mnt/smbshare/... and we bind that Linux host path (full multi-TB capacity).

services:
  minio-postgres:
    build:
      context: .
      dockerfile: Dockerfile
    image: agent-minio-postgres:latest
    container_name: agent-minio-postgres
    restart: unless-stopped
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agent}
      POSTGRES_DB: ${POSTGRES_DB:-agent_constructor}
      POSTGRES_PORT: "5432"
      FAKE_FREE_BYTES: ${FAKE_FREE_BYTES:-10995116277760}
      POSTGRES_IMG_SIZE_GB: ${POSTGRES_IMG_SIZE_GB:-8}
      DATA_ROOT: /data
    volumes:
      - type: bind
        source: ${DATA_HOST_PATH}
        target: /data
        bind:
          create_host_path: false
    devices:
      - /dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    privileged: true
