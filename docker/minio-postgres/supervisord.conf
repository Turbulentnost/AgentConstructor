[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

[program:postgres]
command=/bin/bash -c "source /etc/supervisor/conf.d/runtime.env && exec env LD_PRELOAD=\"$LD_PRELOAD\" FAKE_FREE_BYTES=\"$FAKE_FREE_BYTES\" \"$PG_BIN/postgres\" -D \"$POSTGRES_DATA\" -c listen_addresses=* -p \"$POSTGRES_PORT\""
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err
stopsignal=INT
stopwaitsecs=30

[program:minio]
command=/bin/bash -c "source /etc/supervisor/conf.d/runtime.env && exec env MINIO_ROOT_USER=\"$MINIO_ROOT_USER\" MINIO_ROOT_PASSWORD=\"$MINIO_ROOT_PASSWORD\" /usr/local/bin/minio server \"$MINIO_DATA_PATH\" --address :9000 --console-address :9001"
user=root
autostart=true
autorestart=true
priority=20
stdout_logfile=/var/log/supervisor/minio.log
stderr_logfile=/var/log/supervisor/minio.err
stopwaitsecs=20
